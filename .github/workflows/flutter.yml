name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-analyze:
    name: Run Analysis & Unit Tests (TDD Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis (Linter)
        run: flutter analyze

      - name: Execute Unit Tests with Coverage (TDD Gate)
        run: flutter test --coverage

      - name: Check Coverage Report Generation
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "✅ Relatório LCOV de cobertura gerado com sucesso!"
            ls -lh coverage/lcov.info
          else
            echo "⚠️ Arquivo de cobertura não encontrado!"
            exit 1
          fi
